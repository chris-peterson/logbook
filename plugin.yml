# Canonical descriptor for the logbook plugin — edit here, never plugin.json.
# CI's project job (.github/workflows/project.yml) projects this into
# .claude-plugin/plugin.json and the marketplace SPA (the suite: block).

name: logbook
version: 0.15.1
description: A log of important learnings, e.g. AI-assisted coding session retros.
author: Chris Peterson
repository: https://github.com/chris-peterson/logbook
keywords: [retrospective, ai, session, claude-code]
license: MIT

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/logbook/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: true
  group: record
  dependencies:
    - name: anchor
      required: false
      reason: files a note's issue in the suite's why-first shape
  gloss: The ship's log — what the last crew figured out.
  pitch: "Solved something the hard way? It writes up what you learned and shares it with the team, so no one re-solves it."
  what: "Turns a session into a retrospective committed to a team-owned repo. Your chat transcript stays on your machine — only the write-up is shared, so the next person inherits the lesson, not just the code."
  cmds:
    - ["/logbook:note", "Capture a process/tooling observation; fix now or defer"]
    - ["/logbook:retro", "Publish a session retro to the team repo"]
    - ["logbook", "Same notes + retros from any terminal"]
  # Skill-anchored previews of the two flagship skills, shown live on the docs
  # site; the session: below is the at-a-glance flow the hub also reads.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      note: Record a mid-session observation — friction or a win — as retro material, then act on it.
      retro: Generate a retrospective document from the current AI coding session and publish it to the team retro repo.
      session-id: Print only the active session's id — fast path for when you just need the id.
    hooks:
      cli-freshness: SessionStart — Detect CLI wrapper drift after a plugin update.
      hooks: 'Hook wiring: SessionStart→cli-freshness, orphan-notes; SessionEnd→orphan-notes.'
      orphan-notes: SessionStart / SessionEnd — Surface deferred notes still waiting on a retro.
    commands:
      logbook: Log important learnings from AI coding sessions
  # <<< shipyard:describe <<<
  examples:
    - label: "/logbook:note"
      ac: "--build"
      frames:
        - { t: you, text: "/logbook:note this skill's own example uses plain mktemp, so Write refuses on the 0-byte file it leaves behind" }
        - { t: claude, text: "Recorded as friction against <code>skills/note/references/file-an-issue.md</code>. Switching it to <code>mktemp -u</code> — and the other skills that show a tmp-path example copy this one, so I'll sweep those too." }
        - { t: status, text: "captures the observation, fixes it in place, and sweeps the sites that copy it" }
    - label: "/logbook:retro"
      ac: "--purple"
      frames:
        - { t: you, text: "/logbook:retro", type: true, retro: true }
        - { t: claude, text: "1h 04m, 64 tool calls, ~$19.73. Two frictions you flagged mid-run are already in the notes log — I'll build the write-up around those rather than reconstruct the session cold." }
        - { t: status, text: "commits the retro to the team repo; the transcript never leaves your machine" }
  session:
    - { t: shell, path: "~/src/tack", branch: "main", cmd: "claude" }
    - { t: you, text: "expand the requirement-ID categories to 4 letters" }
    - { t: claude, text: "Renamed them — but padding short names to a fixed width gives you <code>CL → CMDS</code> and <code>DV → DLVR</code>, which read worse than the mix of full words and 3-char abbreviations they replaced." }
    - { t: thought, text: "that lesson belongs to sextant, not this repo" }
    - { t: you, text: "/logbook:note a fixed prefix width optimizes uniformity over readability, and these codes are read far more than typed" }
    - { t: note, text: "friction · target: sextant · disposition: File an issue" }
    - { t: cmd, cmd: "/anchor:issue", out: "Filed in the repo that owns the lesson, why-first, with the naming evidence from this session." }
    - { t: link, text: "sextant#1 — Requirement-ID categories: natural 3–4 char codes, not fixed width", href: "https://github.com/chris-peterson/sextant/issues/1", after: " — tracked work, not a URL waiting to be clicked" }
    - { t: status, text: "back to the tack work — the lesson left the session, the transcript didn't" }

docs:
  code_languages: [bash, yaml, python, json]
  mermaid: true
