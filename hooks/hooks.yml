# Source of record for logbook's hooks — shipyard generates hooks.json.
hooks:
  - event: SessionStart
    command: 'bash ${CLAUDE_PLUGIN_ROOT}/hooks/cli-freshness.sh'
    description: Detect CLI wrapper drift after a plugin update.
  - event: SessionStart
    command: 'bash ${CLAUDE_PLUGIN_ROOT}/hooks/orphan-notes.sh'
    description: Surface deferred notes still waiting on a retro.
  - event: SessionEnd
    command: 'bash ${CLAUDE_PLUGIN_ROOT}/hooks/orphan-notes.sh'
    description: Surface deferred notes still waiting on a retro.
